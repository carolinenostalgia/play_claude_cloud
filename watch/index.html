<style>
/* Layout: the watch fills the screen as a live 3D object; a short chapter card sits at the bottom and drives the camera. */
:root {
  --night: #0d0c0b;
  --ink: #ece6dc;
  --dim: #a69e93;
  --mute: #6e675e;
  --line: #2a2621;
  --gold: #c8a46a;
  --blue: #4f86e8;
  --moon: #e9cf8e;
  --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: radial-gradient(ellipse 90% 60% at 50% 36%, #1f1c18 0%, var(--night) 72%) fixed, var(--night); color: var(--ink); font-family: var(--serif); -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; opacity: 0; transition: opacity .6s ease; }
#app.ready { opacity: 1; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.top { position: absolute; left: 0; right: 0; top: 0; padding: 0 18px; padding-top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; pointer-events: none; }
.top .brand { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--mute); }
.top .hint { font-size: 12px; color: var(--mute); letter-spacing: .1em; }

#labels { position: absolute; inset: 0; pointer-events: none; }
.label { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); white-space: nowrap; opacity: 0; transition: opacity .4s; will-change: transform; }
.label::before { content: ""; width: 18px; height: 1px; background: var(--gold); opacity: .7; }
.label i { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--dim); }
.label.on { opacity: 1; }

.panel {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; box-sizing: border-box;
  padding: 18px 18px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: linear-gradient(rgba(13,12,11,0), rgba(13,12,11,.88) 22px, rgba(13,12,11,.96));
  display: flex; flex-direction: column; gap: 10px;
}
.meta { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--mute); }
.meta b { font-weight: 400; color: var(--gold); }
.panel h2 { margin: 0; font-weight: 300; font-size: clamp(20px, 3.1svh, 25px); line-height: 1.3; letter-spacing: .03em; }
.panel p { margin: 0; font-size: clamp(13px, 1.9svh, 14px); line-height: 1.8; color: var(--dim); }
.panel p strong { font-weight: 500; color: var(--ink); }
.extra:empty { display: none; }
.formula { border: 1px solid var(--gold); padding: 10px 12px; font-family: var(--mono); font-size: 14px; line-height: 1.7; color: var(--ink); }
.formula em { font-style: normal; color: var(--gold); }
.formula small { display: block; font-family: var(--serif); font-size: 12px; color: var(--dim); }
.hud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.hud div { background: #11100e; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.hud span { font-size: 11px; color: var(--mute); }
.hud b { font-family: var(--mono); font-weight: 400; font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud b.moon { font-family: var(--serif); color: var(--moon); }

.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 12px; letter-spacing: .1em; color: var(--dim); background: transparent; border: 1px solid #3a352f; border-radius: 999px; padding: 5px 12px; min-height: 32px; cursor: pointer; }

<script>
/* ================= fonts first, so nothing changes shape ================= */
const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let fontsReady = false;
Promise.all(["300 16px 'Noto Serif SC'", "400 16px 'IBM Plex Mono'"].map(f => document.fonts.load(f, "拆开表0123")))
  .catch(() => {}).then(() => { fontsReady = true; });

if (!window.THREE || !THREE.OrbitControls) {
  $("fallback").style.display = "grid";
  $("app").classList.add("ready");
  throw new Error("three.js not available");
}

/* ================= renderer, camera, light ================= */
const canvas = $("gl");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e) { $("fallback").style.display = "grid"; $("app").classList.add("ready"); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;

const scene = new THREE.Scene();
if (THREE.RoomEnvironment) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
}
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x1a1612, 0.35));
const key = new THREE.DirectionalLight(0xfff1dc, 1.1);
key.position.set(-20, 30, 40);
scene.add(key);

const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 600);
camera.position.set(0, -6, 70);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 14;
controls.maxDistance = 140;
controls.rotateSpeed = 0.7;

/* ================= materials ================= */
const M = {
  gold: () => new THREE.MeshStandardMaterial({ color: 0xd9a646, metalness: 1, roughness: 0.3, envMapIntensity: 0.85 }),
  rose: () => new THREE.MeshStandardMaterial({ color: 0xcf9a5c, metalness: 1, roughness: 0.34, envMapIntensity: 0.8 }),
  steel: () => new THREE.MeshStandardMaterial({ color: 0xb9bdc5, metalness: 1, roughness: 0.24, envMapIntensity: 0.8 }),
  rhodium: () => new THREE.MeshStandardMaterial({ color: 0x7a756c, metalness: 0.9, roughness: 0.45, envMapIntensity: 0.6 }),
  blued: () => new THREE.MeshStandardMaterial({ color: 0x2d5fc4, metalness: 0.8, roughness: 0.25, emissive: 0x0a1a40, emissiveIntensity: 0.6 }),
  ruby: () => new THREE.MeshStandardMaterial({ color: 0xb0213a, metalness: 0.1, roughness: 0.15, emissive: 0x3a0610, emissiveIntensity: 0.6 }),
  hand: () => new THREE.MeshStandardMaterial({ color: 0xf0ece4, metalness: 0.9, roughness: 0.2 }),
  glass: () => new THREE.MeshStandardMaterial({ color: 0xbfd4e8, metalness: 0, roughness: 0.05, transparent: true, opacity: 0.12, depthWrite: false }),
};

/* ================= geometry helpers ================= */
function gearShape(teeth, mod, { hole = 0.18, spokes = 0, hubR = 0 } = {}) {
  const r = mod * teeth / 2, ra = r + mod * 0.9, rf = r - mod * 1.15, step = Math.PI * 2 / teeth;
  const s = new THREE.Shape();
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    [[rf, 0], [rf, 0.18], [ra, 0.34], [ra, 0.52], [rf, 0.68], [rf, 1]].forEach(([rr, k], j) => {
      const x = rr * Math.cos(a + k * step), y = rr * Math.sin(a + k * step);
      if (i === 0 && j === 0) s.moveTo(x, y); else s.lineTo(x, y);
    });
  }
  if (spokes && r > 1.2) {
    const rim = rf - Math.max(mod * 1.4, r * 0.1), hub = Math.max(hubR || r * 0.22, hole * 2.4), gap = 0.18;
    for (let k = 0; k < spokes; k++) {
      const a0 = k * Math.PI * 2 / spokes, a1 = (k + 1) * Math.PI * 2 / spokes;
      const h = new THREE.Path();
      h.absarc(0, 0, rim, a0 + gap * (r / rim) * 0.3 + 0.12, a1 - 0.12, false);
      h.absarc(0, 0, hub, a1 - 0.12 - gap, a0 + 0.12 + gap, true);
      s.holes.push(h);
    }
  }
  if (hole) { const h = new THREE.Path(); h.absarc(0, 0, hole, 0, Math.PI * 2, true); s.holes.push(h); }
  return s;
}
function extrude(shape, depth, mat, curve = 8) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: curve });
  g.translate(0, 0, -depth / 2);
  return new THREE.Mesh(g, mat);
}
function gear(teeth, mod, depth, mat, opts) { return extrude(gearShape(teeth, mod, opts), depth, mat); }
function disc(r, depth, mat, holes = []) {
  const s = new THREE.Shape(); s.absarc(0, 0, r, 0, Math.PI * 2, false);
  holes.forEach(fn => { const h = new THREE.Path(); fn(h); s.holes.push(h); });
  return extrude(s, depth, mat, 64);
}
function cyl(r, h, mat, seg = 32) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat); m.rotation.x = Math.PI / 2; return m; }
function torus(R, t, mat) { return new THREE.Mesh(new THREE.TorusGeometry(R, t, 12, 72), mat); }
function bar(x0, y0, x1, y1, w, h, mat) {
  const len = Math.hypot(x1 - x0, y1 - y0), m = new THREE.Mesh(new THREE.BoxGeometry(len, w, h), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, 0); m.rotation.z = Math.atan2(y1 - y0, x1 - x0); return m;
}
function canvasTex(size, draw) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  t.redraw = () => { draw(c.getContext("2d"), size); t.needsUpdate = true; };
  t.redraw(); return t;
}

/* ================= layout constants (units ≈ mm) ================= */
const R_DIAL = 15, TB = new THREE.Vector2(0, -8.8), MOON_C = new THREE.Vector2(0, 4), DATE_C = new THREE.Vector2(-7.4, 0.6);
const THIRD = new THREE.Vector2(5.44, -4.72), DAY24 = new THREE.Vector2(-5.09, 5.09), BARREL = new THREE.Vector2(7.2, 5.6);
const watch = new THREE.Group(); scene.add(watch);
const layers = [];
function layer(key, name, note, baseZ, exZ, anchor) {
  const g = new THREE.Group(); g.position.z = baseZ; watch.add(g);
  const L = { key, name, note, g, baseZ, exZ, anchor: new THREE.Vector3(...anchor), fade: 1, fadeTo: 1 };
  layers.push(L); return L;
}

/* ---------- case ---------- */
const Lcase = layer("case", "表壳", "", 0, 0, [17.6, 0, 1]);
{
  const prof = [[15.2, -2.0], [16.8, -2.0], [17.4, -1.2], [17.7, 1.0], [17.5, 3.0], [16.6, 4.1], [15.6, 4.3], [15.3, 3.9], [15.3, -1.6]].map(([r, z]) => new THREE.Vector2(r, z));
  const lathe = new THREE.Mesh(new THREE.LatheGeometry(prof, 128), M.rose()); lathe.rotation.x = Math.PI / 2; lathe.material.side = THREE.DoubleSide;
  Lcase.g.add(lathe);
  const crown = cyl(1.3, 2.2, M.rose()); crown.rotation.set(0, 0, Math.PI / 2); crown.position.set(18.6, 0, 1); Lcase.g.add(crown);
  const crownR = new THREE.Mesh(new THREE.TorusGeometry(1.32, 0.12, 6, 40), M.rose()); crownR.rotation.y = Math.PI / 2; crownR.position.set(19.5, 0, 1); Lcase.g.add(crownR);
  [[-7, 17.6], [7, 17.6], [-7, -17.6], [7, -17.6]].forEach(([x, y]) => { const lug = new THREE.Mesh(new THREE.BoxGeometry(3.2, 5, 2.6), M.rose()); lug.position.set(x, y, 0.6); Lcase.g.add(lug); });
}

/* ---------- caseback ---------- */
const Lback = layer("back", "底盖", "蓝宝石玻璃窗", -2.3, -14, [16.6, -2, 0]);
{
  Lback.g.add(disc(17, 0.6, M.rose(), [h => h.absarc(0, 0, 12, 0, Math.PI * 2, true)]));
  const glass = disc(12, 0.3, M.glass()); Lback.g.add(glass);
}

/* ---------- mainplate & barrel ---------- */
const Lplate = layer("plate", "主夹板 · 发条盒", "储存 70 小时动力", -1.15, -8.5, [15, 2, 0]);
{
  const plate = disc(14.8, 0.6, M.rhodium(), [h => h.absarc(TB.x, TB.y, 5.6, 0, Math.PI * 2, true)]);
  Lplate.g.add(plate);
  const barrel = gear(60, 0.16, 1.4, M.gold(), { hole: 0.5, spokes: 0 }); barrel.position.set(BARREL.x, BARREL.y, 0.9); Lplate.g.add(barrel); Lplate.barrel = barrel;
  const cap = cyl(4.3, 0.2, M.gold()); cap.position.set(BARREL.x, BARREL.y, 1.65); Lplate.g.add(cap);
  [[0, 0], [THIRD.x, THIRD.y], [BARREL.x, BARREL.y], [DAY24.x, DAY24.y], [DATE_C.x, DATE_C.y], [-9.5, -6], [9.8, -1.5]].forEach(([x, y]) => {
    const j = cyl(0.42, 0.35, M.ruby()); j.position.set(x, y, 0.35); Lplate.g.add(j);
    const ring = torus(0.62, 0.12, M.gold()); ring.position.set(x, y, 0.36); Lplate.g.add(ring);
  });
  [[-11.5, 6.5], [11.8, -6.2], [-3.5, -13.4], [3.5, 12.9], [-12.6, -2.6]].forEach(([x, y]) => {
    const sc = cyl(0.7, 0.4, M.blued()); sc.position.set(x, y, 0.4); Lplate.g.add(sc);
    const slot = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.18, 0.2), M.rhodium()); slot.position.set(x, y, 0.62); slot.rotation.z = x; Lplate.g.add(slot);
  });
}

/* ---------- going train: centre 80 → third 10/75 → cage pinion 10 ---------- */
const Ltrain = layer("train", "走时轮系", "80 → 75 → 1 圈/分", -0.25, -4, [12.2, -3, 0]);
const centre = gear(80, 0.16, 0.35, M.gold(), { spokes: 5 }); Ltrain.g.add(centre);
const thirdG = new THREE.Group(); thirdG.position.set(THIRD.x, THIRD.y, 0.45); Ltrain.g.add(thirdG);
thirdG.add(gear(75, 0.16, 0.3, M.gold(), { spokes: 4 }));
{ const p = gear(10, 0.16, 0.8, M.steel(), { hole: 0.1 }); p.position.z = -0.45; thirdG.add(p); }
{ const p = gear(10, 0.16, 0.7, M.steel(), { hole: 0.1 }); p.position.set(0, 0, -0.45); centre.add(p); }
const cagePinion = gear(10, 0.16, 0.6, M.steel(), { hole: 0.12 }); cagePinion.position.set(TB.x, TB.y, 0.45); Ltrain.g.add(cagePinion);

/* ---------- tourbillon ---------- */
const Lcage = layer("cage", "陀飞轮", "60 秒转一圈", 0.75, 1.2, [6.2, -8.8, 0.6]);
const tb = new THREE.Group(); tb.position.set(TB.x, TB.y, 0); Lcage.g.add(tb);
const fixedWheel = gear(84, 0.1, 0.25, M.steel(), { hole: 1.0, spokes: 6, hubR: 1.3 }); fixedWheel.position.z = -0.35; tb.add(fixedWheel);
const cage = new THREE.Group(); tb.add(cage);
{
  const ringTop = torus(3.4, 0.16, M.blued()); ringTop.position.z = 1.55; cage.add(ringTop);
  const ringBot = torus(3.4, 0.16, M.blued()); ringBot.position.z = -0.1; cage.add(ringBot);
  for (let k = 0; k < 3; k++) {
    const a = k * Math.PI * 2 / 3 + Math.PI / 2;
    const top = bar(0, 0, 4.9 * Math.cos(a), 4.9 * Math.sin(a), 0.42, 0.16, M.blued()); top.position.z = 1.55; cage.add(top);
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 1.7), M.blued()); post.position.set(3.4 * Math.cos(a), 3.4 * Math.sin(a), 0.72); cage.add(post);
  }
  const hub = cyl(0.55, 0.3, M.blued()); hub.position.z = 1.62; cage.add(hub);
  const jewel = cyl(0.25, 0.32, M.ruby()); jewel.position.z = 1.66; cage.add(jewel);
  const secHand = bar(0, 0, 0, 4.9, 0.22, 0.1, M.blued()); secHand.position.z = 1.75; cage.add(secHand);
}
const balance = new THREE.Group(); balance.position.z = 0.75; cage.add(balance);
{
  balance.add(torus(2.3, 0.22, M.gold()));
  balance.add(bar(-2.3, 0, 2.3, 0, 0.25, 0.18, M.gold()));
  balance.add(bar(0, -2.3, 0, 2.3, 0.25, 0.18, M.gold()));
  [0, 1, 2, 3].forEach(k => { const w = cyl(0.28, 0.32, M.gold()); w.position.set(2.3 * Math.cos(k * Math.PI / 2 + 0.6), 2.3 * Math.sin(k * Math.PI / 2 + 0.6), 0); balance.add(w); });
  const roller = cyl(0.5, 0.2, M.steel()); roller.position.z = -0.35; balance.add(roller);
  const pin = cyl(0.1, 0.3, M.ruby()); pin.position.set(0.45, 0, -0.38); balance.add(pin);
}
const spring = (() => {
  const pts = []; for (let i = 0; i <= 260; i++) { const t = i / 260 * Math.PI * 2 * 7.5; const r = 0.35 + t * 0.034; pts.push(new THREE.Vector3(r * Math.cos(t), r * Math.sin(t), 0)); }
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 520, 0.035, 5, false), M.blued());
  m.position.z = 1.15; return m;
})();
cage.add(spring);
const ESC_POS = new THREE.Vector2(4.2 + 0.36, 0).rotateAround(new THREE.Vector2(), -Math.PI / 6);
const escape = new THREE.Group(); escape.position.set(ESC_POS.x, ESC_POS.y, 0.15); cage.add(escape);
escape.add(gear(15, 0.15, 0.22, M.steel(), { hole: 0.08 }));
{ const p = gear(7, 0.1, 0.5, M.steel(), { hole: 0.06 }); p.position.z = -0.4; escape.add(p); }
const fork = new THREE.Group(); fork.position.set(ESC_POS.x * 0.55, ESC_POS.y * 0.55, 0.28); cage.add(fork);
{
  const dir = Math.atan2(ESC_POS.y, ESC_POS.x);
  const arm = bar(-1.3, 0, 1.1, 0, 0.2, 0.15, M.steel()); fork.add(arm);
  const cross = bar(0.6, -0.7, 0.6, 0.7, 0.2, 0.15, M.steel()); fork.add(cross);
  [[0.6, -0.75], [0.6, 0.75]].forEach(([x, y]) => { const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.2), M.ruby()); p.position.set(x + 0.2, y, 0); fork.add(p); });
  fork.rotation.z = dir; fork.userData.base = dir;
}

/* ---------- calendar & moon ---------- */
const Lday = layer("day", "24 小时轮", "80 齿 · 一天一圈", 1.85, 4.6, [-12.5, 5.5, 0]);
const hourWheel = gear(40, 0.12, 0.25, M.gold(), { hole: 0.3, spokes: 0 }); Lday.g.add(hourWheel);
const day24 = new THREE.Group(); day24.position.set(DAY24.x, DAY24.y, 0); Lday.g.add(day24);
day24.add(gear(80, 0.12, 0.25, M.gold(), { spokes: 5 }));
{ const finger = bar(0, 0, 0, 5.2, 0.3, 0.3, M.steel()); finger.position.z = 0.25; day24.add(finger); }

const Ldate = layer("date", "日历轮", "31 齿 · 一天一格", 2.2, 7, [-11.6, -1.6, 0]);
const dateWheel = gear(31, 0.19, 0.22, M.steel(), { hole: 0.2, spokes: 3 }); dateWheel.position.set(DATE_C.x, DATE_C.y, 0); Ldate.g.add(dateWheel);

const Lmoon = layer("moon", "月相盘", "59 齿 · 两个月亮", 2.45, 9.5, [8.4, 6.5, 0]);
const moonTex = canvasTex(1024, (ctx, S) => {
  const k = S / 15, c = S / 2;
  const g = ctx.createRadialGradient(c, c, 0, c, c, c); g.addColorStop(0, "#22345c"); g.addColorStop(1, "#121c34");
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 160; i++) { const a = Math.random() * Math.PI * 2, r = Math.random() * 6.7 * k; ctx.fillStyle = `rgba(233,207,142,${0.25 + Math.random() * 0.6})`; ctx.beginPath(); ctx.arc(c + r * Math.cos(a), c + r * Math.sin(a), Math.random() * 2.2 + 0.6, 0, 7); ctx.fill(); }
  [0, Math.PI].forEach(a => {
    const x = c + 5 * k * Math.cos(a), y = c + 5 * k * Math.sin(a), r = 1.9 * k;
    const mg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r); mg.addColorStop(0, "#fbe8b6"); mg.addColorStop(1, "#c9a457");
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(150,110,50,.35)"; [[-.3, -.2, .28], [.25, .3, .2], [.1, -.45, .14]].forEach(([dx, dy, rr]) => { ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, rr * r, 0, 7); ctx.fill(); });
  });
});
moonTex.center.set(0.5, 0.5); moonTex.repeat.set(1 / 15, 1 / 15); moonTex.offset.set(0.5, 0.5);
const moonDisc = new THREE.Group(); moonDisc.position.set(MOON_C.x, MOON_C.y, 0); Lmoon.g.add(moonDisc);
{
  const teeth = gear(59, 0.237, 0.18, M.gold(), { hole: 0, spokes: 0 }); teeth.position.z = -0.12; moonDisc.add(teeth);
  const face = new THREE.Mesh(new THREE.CircleGeometry(6.8, 96), new THREE.MeshStandardMaterial({ map: moonTex, metalness: 0.3, roughness: 0.5 }));
  face.position.z = 0.0; moonDisc.add(face);
  const uv = face.geometry.attributes.uv, pos = face.geometry.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / 15 + 0.5, pos.getY(i) / 15 + 0.5);
  moonTex.repeat.set(1, 1); moonTex.offset.set(0, 0);
}

/* ---------- dial ---------- */
const Ldial = layer("dial", "表盘", "月相窗 · 日历 · 陀飞轮窗", 2.85, 12.5, [15.5, 3, 0]);
const dialTex = canvasTex(2048, (ctx, S) => {
  const k = S / 30, X = x => S / 2 + x * k, Y = y => S / 2 - y * k;
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2); g.addColorStop(0, "#1c2a48"); g.addColorStop(1, "#0f1626");
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  ctx.strokeStyle = "rgba(255,255,255,.05)"; ctx.lineWidth = 2;
  for (let r = 0.6; r < 15; r += 0.32) { ctx.beginPath(); ctx.arc(S / 2, S / 2, r * k, 0, 7); ctx.stroke(); }
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * Math.PI * 2, s = Math.sin(a), c = Math.cos(a);
    ctx.strokeStyle = i % 5 ? "#7d8aa6" : "#c8a46a"; ctx.lineWidth = i % 5 ? 3 : 6;
    ctx.beginPath(); ctx.moveTo(X(14.6 * s), Y(14.6 * c)); ctx.lineTo(X((i % 5 ? 13.9 : 13.4) * s), Y((i % 5 ? 13.9 : 13.4) * c)); ctx.stroke();
  }
  [1, 2, 3, 4, 5, 7, 8, 10, 11].forEach(h => {
    const a = h / 12 * Math.PI * 2, s = Math.sin(a), c = Math.cos(a);
    ctx.save(); ctx.translate(X(12.2 * s), Y(12.2 * c)); ctx.rotate(a);
    const lg = ctx.createLinearGradient(-14, 0, 14, 0); lg.addColorStop(0, "#f0d9a8"); lg.addColorStop(1, "#a88446");
    ctx.fillStyle = lg; ctx.fillRect(-11, -1.6 * k, 22, 3.2 * k); ctx.restore();
  });
  const dx = X(DATE_C.x), dy = Y(DATE_C.y);
  ctx.fillStyle = "#0e1524"; ctx.beginPath(); ctx.arc(dx, dy, 3.6 * k, 0, 7); ctx.fill();
  ctx.strokeStyle = "#3a4560"; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = "#a8b2c8"; ctx.font = `${0.62 * k}px 'IBM Plex Mono', monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let d = 1; d <= 31; d++) {
    const a = (d - 1) / 31 * Math.PI * 2, s = Math.sin(a), c = Math.cos(a);
    if ([1, 5, 10, 15, 20, 25].includes(d)) ctx.fillText(String(d), dx + 2.75 * k * s, dy - 2.75 * k * c);
    else { ctx.beginPath(); ctx.arc(dx + 2.75 * k * s, dy - 2.75 * k * c, 4, 0, 7); ctx.fill(); }
  }
  ctx.fillStyle = "#7d8aa6"; ctx.font = `${0.5 * k}px 'IBM Plex Mono', monospace`;
  ctx.fillText("DATE", dx, dy + 1.25 * k);
  ctx.fillStyle = "#c8a46a"; ctx.font = `${0.55 * k}px 'IBM Plex Mono', monospace`;
  ctx.fillText("TOURBILLON", X(0), Y(-2.6));
  ctx.fillStyle = "#8a96b2"; ctx.font = `${0.42 * k}px 'IBM Plex Mono', monospace`;
  ctx.fillText("PHASES DE LUNE", X(0), Y(6.6));
});
const dialShape = new THREE.Shape(); dialShape.absarc(0, 0, R_DIAL, 0, Math.PI * 2, false);
{ const h = new THREE.Path(); h.absarc(TB.x, TB.y, 5.25, 0, Math.PI * 2, true); dialShape.holes.push(h); }
{
  const h = new THREE.Path(), cx = 0, cy = 7.4, R = 3.9;
  h.moveTo(cx - R, cy); h.absarc(cx - R / 2, cy, R / 2, Math.PI, 0, false); h.absarc(cx + R / 2, cy, R / 2, Math.PI, 0, false);
  h.absarc(cx, cy, R, 0, Math.PI, false); dialShape.holes.push(h);
}
{
  const g = new THREE.ExtrudeGeometry(dialShape, { depth: 0.18, bevelEnabled: false, curveSegments: 48 }); g.translate(0, 0, -0.09);
  const uv = g.attributes.uv, pos = g.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / 30 + 0.5, pos.getY(i) / 30 + 0.5);
  Ldial.g.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: dialTex, metalness: 0.35, roughness: 0.45 })));
  const rim = torus(R_DIAL - 0.05, 0.12, M.gold()); Ldial.g.add(rim);

/* ---------- hands ---------- */
const Lhands = layer("hands", "指针", "时 · 分 · 日期", 3.35, 17.5, [12.5, 6, 0]);
function handMesh(len, w, tail, mat) {
  const s = new THREE.Shape(); s.moveTo(-w * 0.5, -tail); s.lineTo(w * 0.5, -tail); s.lineTo(w * 0.42, len * 0.8); s.lineTo(0, len); s.lineTo(-w * 0.42, len * 0.8); s.closePath();
  const ring = new THREE.Path(); ring.absarc(0, 0, w * 0.32, 0, Math.PI * 2, true); s.holes.push(ring);
  return extrude(s, 0.12, mat);
}
const hourHand = handMesh(7.6, 1.1, 1.6, M.hand()); hourHand.position.z = 0; Lhands.g.add(hourHand);
const minuteHand = handMesh(12.4, 0.8, 2.2, M.hand()); minuteHand.position.z = 0.25; Lhands.g.add(minuteHand);

/* per-layer materials, so each layer can fade on its own */
layers.forEach(L => {

/* ================= labels ================= */
const labelEls = layers.filter(L => L.key !== "case").map(L => {

/* ================= simulated time ================= */
const SYNODIC = 29.530589, REF_NEW_MOON = Date.UTC(2000, 0, 6, 18, 14) / 1000;
const start = new Date();
let tSim = (start.getHours() * 3600 + start.getMinutes() * 60 + start.getSeconds()) + start.getMilliseconds() / 1000;
const day0 = new Date(start.getFullYear(), start.getMonth(), start.getDate());
let speed = 1, speedTo = 1, mechClock = 0;
const PHASES = [[0.03, "新月"], [0.22, "蛾眉月"], [0.28, "上弦月"], [0.47, "盈凸月"], [0.53, "满月"], [0.72, "亏凸月"], [0.78, "下弦月"], [0.97, "残月"], [1.01, "新月"]];
function phaseName(f) { return PHASES.find(([x]) => f < x)[1]; }
function moonAge(days) {
  const t = day0.getTime() / 1000 + days * 86400;
  return (((t - REF_NEW_MOON) / 86400 / SYNODIC) % 1 + 1) % 1;
}
const ease = (k) => k < 0 ? 0 : k > 1 ? 1 : k * k * (3 - 2 * k);
function stepped(x, w) { const i = Math.floor(x); return i + ease((x - i) / w); }

function animateMechanism(dt) {
  mechClock += dt * Math.min(speed, 1);
  const TAU = Math.PI * 2;
  const minuteA = tSim / 3600 * TAU, hourA = tSim / 43200 * TAU, secA = tSim / 60 * TAU;
  hourHand.rotation.z = -hourA; minuteHand.rotation.z = -minuteA;
  centre.rotation.z = -minuteA;
  thirdG.rotation.z = minuteA * 8;
  cagePinion.rotation.z = -secA;
  cage.rotation.z = -secA;
  hourWheel.rotation.z = -hourA;
  day24.rotation.z = (tSim / 86400) * TAU;
  if (Lplate.barrel) Lplate.barrel.rotation.z = -minuteA / 7;

  const beats = mechClock * 6;
  const balanceA = 3.4 * Math.sin(Math.PI * 6 * mechClock);
  balance.rotation.z = balanceA;
  spring.rotation.z = balanceA * 0.35;
  spring.scale.setScalar(1 + Math.sin(balanceA) * 0.03);
  fork.rotation.z = fork.userData.base + (Math.cos(Math.PI * 6 * mechClock) > 0 ? 0.16 : -0.16);
  escape.rotation.z = -(stepped(beats, 0.25) / 30) * TAU;

  const days = Math.floor(tSim / 86400), frac = (tSim / 86400) - days;
  const jump = ease((frac - 0.0) / 0.03);
  const dayFloat = days - 1 + jump;
  const today = new Date(day0.getTime() + days * 86400000);
  const d = today.getDate();
  const prevD = new Date(day0.getTime() + (days - 1) * 86400000).getDate();
  const shownD = jump < 1 ? prevD + (d === 1 && prevD > 1 ? (32 - prevD) : (d - prevD)) * jump : d;
  const dateA = -((shownD - 1) / 31) * TAU;
  dateHand.rotation.z = dateA; dateWheel.rotation.z = dateA;
  const age = moonAge(days - 1 + jump);
  moonDisc.rotation.z = Math.PI / 2 - (age - 0.5) * Math.PI;
  return { d, age, days };
}

/* ================= chapters ================= */
const ALL = layers.map(L => L.key);
const CH = [
  { tag: "开场", title: "一只表里的天文台", cam: [0, -8, 70], target: [0, 0, 0], explode: 0, speed: 1, focus: ALL, labels: false,
    text: "它记得今天几号、今晚月亮多圆，还让表的心脏在一个小笼子里，每分钟转一圈。指针走的是<strong>你此刻的真实时间</strong>，月相也是今晚真实的月亮。" },
  { tag: "爆炸图", title: "拆开：十层零件", cam: [42, -46, 52], target: [0, 0, 3], explode: 1, speed: 1, focus: ALL.filter(k => k !== "case"), labels: true, slider: true,
    text: "从表镜到底盖，三套机构叠在一起：<strong>走时</strong>负责时分秒，<strong>日历和月相</strong>每天推一格，<strong>陀飞轮</strong>让心脏转着圈工作。拖动下面的滑杆，把它拆开或装回去。" },
  { tag: "计算一", title: "为什么秒针刚好 60 秒一圈", cam: [20, -30, 34], target: [2, -4, -2], explode: 0.55, speed: 90, focus: ["train", "cage", "plate"], labels: false,

    extra: () => `<div class="formula">80/10 × 75/10 = <em>60</em><small>中心轮 80 齿 → 三轮小齿轮 10 齿；三轮 75 齿 → 框架小齿轮 10 齿</small></div>` },
  { tag: "擒纵", title: "表的心跳：一次只放一个齿", cam: [9, -20, 16], target: [0, -8.8, 1.5], explode: 0.25, speed: 0.12, focus: ["cage"], labels: false,

  { tag: "陀飞轮", title: "把心脏关进笼子，让它转圈", cam: [-20, -30, 16], target: [0, -8.8, 0.5], explode: 0.12, speed: 6, focus: ["cage", "train"], labels: false,

    text: "快进：每秒走 1.6 天。24 小时轮每天午夜用拨指推一下，<strong>日历轮 31 齿</strong>前进一格，<strong>月相盘 59 齿</strong>也前进一格。盘上有两个月亮，59 ÷ 2 = 29.5 天走完一轮。",
    extra: (s) => `<div class="hud"><div><span>日期</span><b>${s.date}</b></div><div><span>月相</span><b class="moon">${s.phase}</b></div><div><span>已过</span><b>${s.days} 天</b></div></div>
      <div class="formula">29.53059 − 29.5 = <em>0.0306</em> 天/月<small>真实月亮比 29.5 天多一点，所以大约 2.7 年要手动调一天</small></div>` },
  { tag: "合上", title: "一百多个零件，一秒不差", cam: [-22, -40, 58], target: [0, 0, 0], explode: 0, speed: 1, focus: ALL, labels: false, outro: true,
    text: "手腕一动，发条上紧；齿轮按齿数比把力一级级分下去；擒纵一次放一个齿；陀飞轮带着心脏转圈。没有一节电池。拖动它，从任何角度再看一遍。" },
];

let chap = 0, tween = null, explode = 0, explodeTo = 0, userExplode = null, lastCalendar = "";
function setChapter(i, instant) {
  chap = Math.max(0, Math.min(CH.length - 1, i));
  const c = CH[chap];
  $("chapNo").textContent = `${String(chap + 1).padStart(2, "0")} / ${String(CH.length).padStart(2, "0")}`;
  $("chapTag").textContent = c.tag;
  $("chapTitle").textContent = c.title;
  $("chapText").innerHTML = c.text;
  $("chapExtra").innerHTML = c.extra && !c.calendar ? c.extra() : "";
  lastCalendar = "";
  $("prev").disabled = chap === 0;
  $("nextLabel").textContent = chap === CH.length - 1 ? "从头再看" : chap === 0 ? "拆开它" : "下一章";
  $("dots").innerHTML = CH.map((_, k) => `<i class="${k === chap ? "on" : ""}"></i>`).join("");
  buildTools(c);
  userExplode = null;
  explodeTo = c.explode;
  speedTo = c.speed;
  if (!c.calendar && Math.abs(tSim - realNowSec()) > 120 && (chap === 0 || c.outro)) tSim = realNowSec();
  layers.forEach(L => { L.fadeTo = c.focus.includes(L.key) ? 1 : 0.08; });
  controls.autoRotate = chap === 0 || !!c.outro; controls.autoRotateSpeed = 0.6;
  const from = { p: camera.position.clone(), t: controls.target.clone() };
  const tt = new THREE.Vector3(...c.target);
  const to = { p: new THREE.Vector3(...c.cam).sub(tt).multiplyScalar(fitK()).add(tt), t: tt };
  tween = { from, to, t0: performance.now(), dur: instant || reduced ? 1 : 1700 };
}
/* portrait screens need the camera further back to fit the watch's width */
function fitK() { const a = innerWidth / innerHeight; return a < 0.8 ? Math.min(1.75, 0.8 / a) : 1; }
function realNowSec() { const n = new Date(); return (n - day0) / 1000; }
function buildTools(c) {
  const box = $("tools"); box.innerHTML = "";
  if (c.slider) {
    const lab = document.createElement("label"); lab.className = "slider";
    lab.innerHTML = `<span>拆开程度</span><input type="range" min="0" max="100" value="100" id="exSlider" aria-label="拆开程度">`;
    box.append(lab);
    lab.querySelector("input").addEventListener("input", e => { userExplode = e.target.value / 100; });
  }
  const opts = c.calendar ? [["快进", c.speed], ["回到今天", "today"]] : [["实时", 1], ["慢放", 0.12], ["快进", 90]];
  opts.forEach(([label, v]) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip" + (v === c.speed ? " on" : ""); b.textContent = label;
    b.addEventListener("click", () => {
      if (v === "today") { tSim = realNowSec(); return; }
      speedTo = v; [...box.querySelectorAll(".chip")].forEach(x => x.classList.toggle("on", x === b));
    });
    box.append(b);
  });
}
$("prev").addEventListener("click", () => setChapter(chap - 1));
$("next").addEventListener("click", () => setChapter(chap === CH.length - 1 ? 0 : chap + 1));

/* ================= sizing: keep the watch above the card ================= */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const panelH = document.querySelector(".panel").offsetHeight;
  camera.setViewOffset(w, h, 0, Math.min(panelH * 0.5, h * 0.3), w, h);
  camera.fov = w / h < 0.75 ? 40 : 30;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
new ResizeObserver(resize).observe(document.querySelector(".panel"));

/* ================= frame loop ================= */
const v3 = new THREE.Vector3();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  speed += (speedTo - speed) * Math.min(1, dt * (speedTo > speed ? 1.5 : 6));
  if (Math.abs(speed - speedTo) < 0.01 * Math.max(1, speedTo)) speed = speedTo;
  tSim += dt * speed;

  const target = userExplode ?? explodeTo;
  explode += (target - explode) * Math.min(1, dt * 3);
  layers.forEach(L => {
    L.g.position.z = L.baseZ + L.exZ * explode;
    L.fade += (L.fadeTo - L.fade) * Math.min(1, dt * 4);
    L.mats.forEach(m => {
      const o = m.userData.baseOpacity * L.fade;
      m.opacity = o; m.transparent = m.userData.baseTransparent || L.fade < 0.98; m.depthWrite = !m.transparent;
    });
  });

  if (tween) {
    const k = ease((now - tween.t0) / tween.dur);
    camera.position.lerpVectors(tween.from.p, tween.to.p, k);
    controls.target.lerpVectors(tween.from.t, tween.to.t, k);
    if (k >= 1) tween = null;
  }
  controls.update();

  const st = animateMechanism(dt);
  if (CH[chap].calendar) {
    const date = `${new Date(day0.getTime() + st.days * 86400000).getMonth() + 1} 月 ${st.d} 日`;
    const s = { date, phase: phaseName(st.age), days: Math.max(0, st.days) };
    const sig = JSON.stringify(s);
    if (sig !== lastCalendar) { lastCalendar = sig; $("chapExtra").innerHTML = CH[chap].extra(s); }
  }

  const W = innerWidth, H = innerHeight, showLabels = CH[chap].labels;
  labelEls.forEach(({ L, el }) => {
    v3.copy(L.anchor); L.g.localToWorld(v3); v3.project(camera);
    const x = (v3.x * 0.5 + 0.5) * W, y = (-v3.y * 0.5 + 0.5) * H;
    el.style.transform = `translate(${x.toFixed(1)}px, ${(y - 8).toFixed(1)}px)`;
    el.classList.toggle("on", showLabels && L.fade > 0.5 && explode > 0.6 && v3.z < 1);
  });

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ================= start ================= */
setChapter(0, true);
resize();
(function waitFonts(tries) {
  if (fontsReady || tries > 60) {
    dialTex.redraw();
    $("app").classList.add("ready");
    requestAnimationFrame(frame);
  } else setTimeout(() => waitFonts(tries + 1), 50);
})(0);
</script>

<style>
/* Layout: the camera fills the screen, repainted as ink on rice paper. A brush title sits at the top;
   a frosted tool tray at the bottom picks what to place, and tapping the picture places it. */
:root {
  --paper: #efe6d2;
  --ink: #1b1915;
  --ink-soft: #6f675b;
  --zhu: #b8321f;
  --tray: rgba(239, 230, 210, .82);
  --line: rgba(27, 25, 21, .16);
  --f-brush: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  --f-ui: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--f-ui);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none;
}
[hidden] { display: none !important; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ink { background: var(--paper); }

.top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; pointer-events: none; }
.top h1 { margin: 0; font: 400 28px/1 var(--f-brush); letter-spacing: .1em; text-shadow: 0 0 10px var(--paper), 0 0 4px var(--paper); }
.chip { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--tray); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

.tray { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  display: flex; gap: 6px; padding: 8px; border-radius: 22px; background: var(--tray); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: calc(100vw - 32px); box-sizing: border-box; }
.tray button { font: 500 13px/1.1 var(--f-ui); color: var(--ink); background: transparent; border: 0; border-radius: 15px;
  padding: 7px 9px; min-width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
.tray button b { font: 400 22px/1 var(--f-brush); }
.tray button.on { background: var(--ink); color: var(--paper); }
.tray .sep { width: 1px; background: var(--line); margin: 4px 2px; }
.tray button:focus-visible { outline: 2px solid var(--zhu); outline-offset: 2px; }

.intro { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--paper); z-index: 5; }
.intro .card { max-width: 340px; text-align: center; }
.intro h2 { margin: 0; font: 400 64px/1 var(--f-brush); letter-spacing: .12em; }
.intro .seal { display: inline-grid; place-items: center; width: 44px; height: 44px; margin-top: 14px; border-radius: 6px; background: var(--zhu);
  color: #fbeedd; font: 400 18px/1 var(--f-brush); writing-mode: vertical-rl; transform: rotate(-6deg); }
.intro p { margin: 18px 0 0; font-size: 15px; line-height: 1.75; color: var(--ink); }
.intro small { display: block; margin-top: 14px; font-size: 12px; line-height: 1.6; color: var(--ink-soft); }
.go { margin-top: 22px; font: 400 22px/1 var(--f-brush); letter-spacing: .2em; color: #fbeedd; background: var(--ink);
  border: 0; border-radius: 999px; padding: 14px 34px; cursor: pointer; }
.go:focus-visible { outline: 2px solid var(--zhu); outline-offset: 3px; }
.toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 18px; border-radius: 14px;
  background: var(--tray); border: 1px solid var(--line); font-size: 14px; text-align: center; max-width: 80vw; pointer-events: none;
  opacity: 0; transition: opacity .3s; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.toast.on { opacity: 1; }
</style>

<body>
<canvas id="ink"></canvas>
<canvas id="over"></canvas>

<header class="top"><h1>水墨镜</h1><span class="chip" id="status">未开镜</span></header>

<nav class="tray" aria-label="工具">
  <button type="button" data-item="lantern" class="on"><b>灯</b>灯笼</button>
  <button type="button" data-item="bonsai"><b>松</b>盆景</button>
  <button type="button" data-item="teapot"><b>壶</b>茶壶</button>
  <span class="sep"></span>
  <button type="button" id="labels" class="on"><b>识</b>识物</button>
  <button type="button" id="clear"><b>清</b>清空</button>
  <button type="button" id="flip"><b>转</b>换镜头</button>
</nav>

<section class="intro" id="intro">
  <div class="card">
    <h2>水墨镜</h2>
    <div class="seal">水墨</div>
    <p>打开摄像头，眼前的一切都会变成一幅水墨画。桌子、椅子、杯子会被认出来；点一下画面，就能在上面放一盏灯笼、一盆盆景或一把茶壶。</p>
    <button class="go" id="go" type="button">开镜</button>
    <small>画面只在你的设备上处理，不上传，不录像。首次打开要下载约十八兆的识物模型。</small>
  </div>
</section>
<div class="toast" id="toast"></div>
<video id="cam" playsinline muted hidden></video>

<script type="module">
const $ = id => document.getElementById(id);
const video = $('cam'), glCanvas = $('ink'), over = $('over'), og = over.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight;
  for (const c of [glCanvas, over]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
}
addEventListener('resize', resize); resize();
function toast(text, ms = 2200) {
  const t = $('toast'); t.textContent = text; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms);
}

/* ---------- the ink filter ----------
   Each frame of the camera is drawn through one fragment shader: edges become brush lines
   (Sobel on brightness), shadows become a few levels of ink wash, the rest is rice paper,
   and anything strongly red keeps a touch of vermilion. */
const gl = glCanvas.getContext('webgl', { premultipliedAlpha: false, preserveDrawingBuffer: false });
const VS = `attribute vec2 p; varying vec2 v; void main(){ v = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
const FS = `precision mediump float;
varying vec2 v; uniform sampler2D tex; uniform vec2 texel; uniform vec4 uvm; uniform float mirror; uniform float time;
float L(vec2 q){ return dot(texture2D(tex, q).rgb, vec3(.299, .587, .114)); }
float hash(vec2 q){ return fract(sin(dot(q, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
  vec2 uv = vec2(mirror > .5 ? 1. - v.x : v.x, 1. - v.y) * uvm.xy + uvm.zw;
  vec2 t = texel * 1.6;
  float tl = L(uv + t * vec2(-1., -1.)), tc = L(uv + t * vec2(0., -1.)), tr = L(uv + t * vec2(1., -1.));
  float ml = L(uv + t * vec2(-1., 0.)), c = L(uv), mr = L(uv + t * vec2(1., 0.));
  float bl = L(uv + t * vec2(-1., 1.)), bc = L(uv + t * vec2(0., 1.)), br = L(uv + t * vec2(1., 1.));
  float gx = -tl - 2. * ml - bl + tr + 2. * mr + br, gy = -tl - 2. * tc - tr + bl + 2. * bc + br;
  float edge = smoothstep(.16, .55, length(vec2(gx, gy)));
  float tone = 1. - (tl + tc + tr + ml + c + mr + bl + bc + br) / 9.;
  tone = mix(tone, floor(tone * 4. + .5) / 4., .55);                 // a few levels of wash
  float wash = smoothstep(.3, .95, tone) * .75;
  float grain = hash(floor(gl_FragCoord.xy / 1.5) + floor(time * 8.));
  float ink = clamp(wash + edge * (.8 + .2 * grain), 0., 1.);
  vec3 paper = vec3(.937, .902, .824) * (.965 + .035 * hash(gl_FragCoord.xy * .37));
  vec3 col = mix(paper, vec3(.105, .098, .082), ink);
  vec3 src = texture2D(tex, uv).rgb;
  float red = smoothstep(.28, .5, src.r - max(src.g, src.b)) * smoothstep(.45, .7, src.r);   // only vivid reds survive
  col = mix(col, vec3(.72, .2, .12), red * .55);
  vec2 d = v - .5; col *= 1. - dot(d, d) * .35;                      // soft vignette
  gl_FragColor = vec4(col, 1.);
}`;
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
for (const [k, val] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, val);
const U = n => gl.getUniformLocation(prog, n);
const uTexel = U('texel'), uUvm = U('uvm'), uMirror = U('mirror'), uTime = U('time');

// Cover-fit: which part of the video fills the screen (in 0..1 video coordinates).
function cover() {
  const vw = video.videoWidth || 1, vh = video.videoHeight || 1, sa = W / H, va = vw / vh;
  const sx = va > sa ? sa / va : 1, sy = va > sa ? 1 : va / sa;
  return { sx, sy, ox: (1 - sx) / 2, oy: (1 - sy) / 2 };
}
let mirrored = false;
function drawInk(t) {
  if (video.readyState < 2) return;
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
  const m = cover();
  gl.uniform2f(uTexel, 1 / video.videoWidth, 1 / video.videoHeight);
  gl.uniform4f(uUvm, m.sx, m.sy, m.ox, m.oy);
  gl.uniform1f(uMirror, mirrored ? 1 : 0);
  gl.uniform1f(uTime, t / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
// Video pixel box -> screen box, through the same cover-fit and mirror.
function toScreen(b) {
  const m = cover(), vw = video.videoWidth, vh = video.videoHeight;
  let x0 = ((b.originX / vw) - m.ox) / m.sx * W, x1 = (((b.originX + b.width) / vw) - m.ox) / m.sx * W;
  const y0 = ((b.originY / vh) - m.oy) / m.sy * H, y1 = (((b.originY + b.height) / vh) - m.oy) / m.sy * H;
  if (mirrored) [x0, x1] = [W - x1, W - x0];
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

/* ---------- camera ---------- */
let facing = 'environment', stream = null;
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  video.srcObject = stream; await video.play();
  const set = stream.getVideoTracks()[0].getSettings();
  // A laptop webcam faces you even when we ask for the back camera; mirror whatever faces the user.
  mirrored = set.facingMode ? set.facingMode === 'user' : !matchMedia('(pointer: coarse)').matches;
}

/* ---------- recognising things ---------- */
const NAMES = { 'dining table': '桌', chair: '椅', couch: '榻', bed: '床', cup: '杯', bottle: '瓶', vase: '瓶', bowl: '碗',
  'potted plant': '盆栽', tv: '屏', laptop: '本', keyboard: '键', mouse: '鼠', 'cell phone': '机', book: '书', clock: '钟',
  person: '人', cat: '猫', dog: '犬', bench: '凳', 'wine glass': '盏', spoon: '匙', fork: '叉', knife: '刀', backpack: '囊',
  handbag: '包', umbrella: '伞', remote: '遥', scissors: '剪', 'teddy bear': '熊', banana: '蕉', apple: '果', orange: '橘',
  car: '车', bicycle: '车', sink: '盆', refrigerator: '柜', oven: '灶', microwave: '炉', toilet: '厕', bird: '鸟' };
const SURFACES = new Set(['dining table', 'chair', 'couch', 'bed', 'bench', 'tv', 'laptop', 'book', 'refrigerator']);
let detector = null, dets = [], lastDetect = 0, showLabels = true;
async function loadDetector() {
  const mp = await import('../zuoyou-hubo/vendor/vision_bundle.mjs');
  const files = { wasmLoaderPath: new URL('../zuoyou-hubo/vendor/wasm/vision_wasm_internal.js', location.href).href,
                  wasmBinaryPath: new URL('../zuoyou-hubo/vendor/wasm/vision_wasm_internal.wasm', location.href).href };
  // CPU on purpose: this small int8 model returned no detections on the GPU delegate in testing,
  // and at ~8 detections a second the CPU keeps up comfortably, phones included.
  detector = await mp.ObjectDetector.createFromOptions(files, {
    baseOptions: { modelAssetPath: new URL('vendor/efficientdet_lite0.tflite', location.href).href, delegate: 'CPU' },
    runningMode: 'VIDEO', scoreThreshold: .35, maxResults: 8 });
}
function detect(now) {
  if (!detector || video.readyState < 2 || now - lastDetect < 120) return;
  lastDetect = now;
  const res = detector.detectForVideo(video, now);
  // The detector misses things on some frames; keep each object for a moment after it was last
  // seen and ease its box toward new sightings, so labels don't flicker and taps land on it.
  const fresh = (res.detections || []).map(d => ({ name: d.categories[0].categoryName, box: toScreen(d.boundingBox) })).filter(d => NAMES[d.name]);
  for (const f of fresh) {
    const old = dets.filter(d => d.name === f.name && d.seen !== now).sort((a, b) => iou(b.box, f.box) - iou(a.box, f.box))[0];
    if (old && iou(old.box, f.box) > .2) { for (const k of ['x', 'y', 'w', 'h']) old.box[k] += (f.box[k] - old.box[k]) * .6; old.seen = now; }
    else dets.push({ ...f, seen: now });
  }
  dets = dets.filter(d => now - d.seen < 800);
  for (const it of items) if (it.anchor) follow(it, now);
}

/* ---------- placed things ----------
   A thing tapped onto a recognised object stores where it sits inside that object's box and
   follows the box as the camera moves; anywhere else it stays where it was put on screen. */
const items = [];
let kind = 'lantern';
const iou = (a, b) => {
  const x = Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)), y = Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  return x * y / (a.w * a.h + b.w * b.h - x * y || 1);
};
function follow(it, now) {
  const a = it.anchor;
  let best = null, bestScore = 0;
  for (const d of dets) {
    if (d.name !== a.name) continue;
    const near = 1 - Math.min(1, Math.hypot(d.box.x + d.box.w / 2 - a.box.x - a.box.w / 2, d.box.y + d.box.h / 2 - a.box.y - a.box.h / 2) / Math.max(a.box.w, a.box.h));
    const sc = Math.max(iou(d.box, a.box), near * .8);
    if (sc > bestScore) { best = d; bestScore = sc; }
  }
  if (best && bestScore > .25) {
    for (const k of ['x', 'y', 'w', 'h']) a.box[k] += (best.box[k] - a.box[k]) * .5;   // smooth the jitter of detection
    a.seen = now;
  }
}
function place(x, y, now) {
  const pad = Math.min(W, H) * .05;   // a tap just outside a box still counts as on it
  const hit = dets.filter(d => x >= d.box.x - pad && x <= d.box.x + d.box.w + pad && y >= d.box.y - pad && y <= d.box.y + d.box.h + pad)
    .sort((p, q) => (SURFACES.has(q.name) - SURFACES.has(p.name)) || p.box.w * p.box.h - q.box.w * q.box.h)[0];
  const it = { kind, x, y, born: now, size: Math.min(W, H) * .16 };
  if (hit) {
    it.anchor = { name: hit.name, box: { ...hit.box }, rx: (x - hit.box.x) / hit.box.w, ry: (y - hit.box.y) / hit.box.h, w0: hit.box.w, seen: now };
    toast(`放在了「${NAMES[hit.name]}」上，镜头移动时会跟着它`, 1800);
  }
  items.push(it);
  if (items.length > 12) items.shift();
}
over.addEventListener('pointerdown', e => { if (stream) place(e.clientX, e.clientY, performance.now()); });

/* ---------- drawing ---------- */
const INK = '#1b1915', ZHU = '#b8321f', GOLD = '#c9a24a';
function brushLabel(d) {
  const { x, y, w, h } = d.box, r = Math.min(14, w * .1, h * .1);
  og.save();
  og.strokeStyle = 'rgba(184,50,31,.85)'; og.lineWidth = 2.5; og.setLineDash([10, 6]);
  og.beginPath(); og.roundRect(x, y, w, h, r); og.stroke();
  og.setLineDash([]);
  const s = 34, lx = Math.min(Math.max(x + 4, 4), W - s - 4), ly = Math.max(y - s - 4, 60);
  og.fillStyle = ZHU; og.beginPath(); og.roundRect(lx, ly, s, s, 5); og.fill();
  og.fillStyle = '#fbeedd'; og.font = `${NAMES[d.name].length > 1 ? 15 : 22}px "Ma Shan Zheng", "STKaiti", serif`;
  og.textAlign = 'center'; og.textBaseline = 'middle'; og.fillText(NAMES[d.name], lx + s / 2, ly + s / 2 + 1);
  og.restore();
}
function lantern(s, t) {
  const sway = Math.sin(t * 1.7) * .12;
  og.rotate(sway);
  og.strokeStyle = INK; og.lineWidth = s * .02; og.beginPath(); og.moveTo(0, -s * 1.15); og.lineTo(0, -s * .9); og.stroke();
  og.fillStyle = GOLD; og.fillRect(-s * .18, -s * .92, s * .36, s * .08); og.fillRect(-s * .18, -s * .2, s * .36, s * .08);
  const g = og.createRadialGradient(-s * .08, -s * .6, s * .05, 0, -s * .55, s * .42);
  g.addColorStop(0, '#f2774f'); g.addColorStop(.6, '#c73a22'); g.addColorStop(1, '#8e2414');
  og.fillStyle = g; og.beginPath(); og.ellipse(0, -s * .55, s * .34, s * .33, 0, 0, 7); og.fill();
  og.strokeStyle = 'rgba(80,20,10,.5)'; og.lineWidth = s * .012;
  for (const k of [-.2, 0, .2]) { og.beginPath(); og.ellipse(0, -s * .55, s * .34 * Math.abs(k) * 2.6 || s * .02, s * .33, 0, 0, 7); og.stroke(); }
  og.strokeStyle = GOLD; og.lineWidth = s * .015;
  for (let k = -3; k <= 3; k++) { og.beginPath(); og.moveTo(k * s * .02, -s * .12); og.lineTo(k * s * .025, s * .02 + Math.abs(k) * -s * .01); og.stroke(); }
  og.fillStyle = 'rgba(255,190,120,.18)'; og.beginPath(); og.arc(0, -s * .55, s * .62, 0, 7); og.fill();   // glow
}
function bonsai(s, t) {
  og.fillStyle = '#5a3b26'; og.beginPath(); og.moveTo(-s * .32, -s * .18); og.lineTo(s * .32, -s * .18); og.lineTo(s * .24, 0); og.lineTo(-s * .24, 0); og.closePath(); og.fill();
  og.fillStyle = '#3e2818'; og.fillRect(-s * .36, -s * .22, s * .72, s * .05);
  og.strokeStyle = INK; og.lineCap = 'round'; og.lineWidth = s * .07;
  og.beginPath(); og.moveTo(0, -s * .22); og.bezierCurveTo(-s * .25, -s * .4, s * .25, -s * .55, -s * .05, -s * .8); og.stroke();
  og.lineWidth = s * .035; og.beginPath(); og.moveTo(-s * .02, -s * .52); og.quadraticCurveTo(s * .2, -s * .6, s * .38, -s * .62); og.stroke();
  const breeze = Math.sin(t * 1.2) * s * .01;
  for (const [x, y, r] of [[-.12, -.86, .2], [.08, -.92, .17], [-.28, -.74, .14], [.36, -.68, .15], [.2, -.75, .12]]) {
    og.fillStyle = 'rgba(28,40,30,.85)'; og.beginPath(); og.ellipse(x * s + breeze, y * s, r * s * 1.25, r * s * .7, 0, 0, 7); og.fill();
    og.fillStyle = 'rgba(60,85,60,.55)'; og.beginPath(); og.ellipse(x * s + breeze - r * s * .2, y * s - r * s * .15, r * s * .7, r * s * .35, 0, 0, 7); og.fill();
  }
}
function teapot(s, t) {
  og.fillStyle = '#e9e1cf'; og.strokeStyle = INK; og.lineWidth = s * .03; og.lineJoin = 'round';
  og.beginPath(); og.ellipse(0, -s * .22, s * .3, s * .22, 0, 0, 7); og.fill(); og.stroke();
  og.beginPath(); og.moveTo(s * .26, -s * .28); og.quadraticCurveTo(s * .46, -s * .3, s * .5, -s * .46); og.stroke();     // spout
  og.beginPath(); og.ellipse(-s * .33, -s * .24, s * .1, s * .12, 0, -1.6, 1.6, true); og.stroke();                     // handle
  og.beginPath(); og.ellipse(0, -s * .43, s * .14, s * .04, 0, 0, 7); og.fill(); og.stroke();                         // lid
  og.fillStyle = INK; og.beginPath(); og.arc(0, -s * .5, s * .035, 0, 7); og.fill();
  og.strokeStyle = 'rgba(184,50,31,.8)'; og.lineWidth = s * .015;                                                      // a red sprig on the belly
  og.beginPath(); og.moveTo(-s * .1, -s * .14); og.quadraticCurveTo(0, -s * .26, s * .12, -s * .2); og.stroke();
  og.strokeStyle = 'rgba(80,75,65,.45)'; og.lineWidth = s * .02; og.lineCap = 'round';                                // steam
  for (let k = 0; k < 2; k++) {
    const ph = (t * .8 + k * .5) % 1;
    og.globalAlpha = 1 - ph;
    og.beginPath(); og.moveTo(s * .5, -s * .5 - ph * s * .2);
    og.bezierCurveTo(s * .42, -s * .6 - ph * s * .3, s * .6, -s * .7 - ph * s * .3, s * .5, -s * .82 - ph * s * .3); og.stroke();
  }
  og.globalAlpha = 1;
}
const DRAW = { lantern, bonsai, teapot };
function drawItems(now) {
  for (const it of items) {
    let x = it.x, y = it.y, s = it.size, alpha = 1;
    if (it.anchor) {
      const a = it.anchor;
      x = a.box.x + a.rx * a.box.w; y = a.box.y + a.ry * a.box.h; s = it.size * Math.min(2.2, Math.max(.45, a.box.w / a.w0));
      alpha = now - a.seen > 1500 ? .45 : 1;          // dim while its object is out of sight
    }
    const grow = Math.min(1, (now - it.born) / 300);
    og.save(); og.globalAlpha = alpha; og.translate(x, y); og.scale(grow, grow);
    og.fillStyle = 'rgba(27,25,21,.18)'; og.beginPath(); og.ellipse(0, 0, s * .32, s * .06, 0, 0, 7); og.fill();   // contact shadow
    DRAW[it.kind](s, now / 1000);
    og.restore();
  }
}

/* ---------- loop ---------- */
function frame(now) {
  drawInk(now);
  detect(now);
  og.setTransform(DPR, 0, 0, DPR, 0, 0);
  og.clearRect(0, 0, W, H);
  if (showLabels) dets.forEach(brushLabel);
  drawItems(now);
  requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
const status = $('status');
$('go').addEventListener('click', async () => {
  try { await startCamera(); }
  catch { toast('摄像头没能打开。请在浏览器里允许使用摄像头后再试。', 4000); return; }
  $('intro').hidden = true;
  status.textContent = '识物模型载入中…';
  requestAnimationFrame(frame);
  try { await loadDetector(); status.textContent = '点画面，放一件东西'; }
  catch { status.textContent = '识物没能启动，仍可放东西'; }
});
document.querySelectorAll('[data-item]').forEach(b => b.addEventListener('click', () => {
  kind = b.dataset.item;
  document.querySelectorAll('[data-item]').forEach(x => x.classList.toggle('on', x === b));
}));
$('labels').addEventListener('click', e => { showLabels = !showLabels; e.currentTarget.classList.toggle('on', showLabels); });
$('clear').addEventListener('click', () => { items.length = 0; });
$('flip').addEventListener('click', async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  items.length = 0;
  try { await startCamera(); } catch { toast('这台设备只有一个摄像头'); }
});
</script>
</body>
</html>

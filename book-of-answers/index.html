<meta charset="utf-8">
<title>每日答案之书</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script>
<style>
/* Layout: a hanging scroll. Moon and two ridges fill the upper sky; the answer is brushed in, stroke by stroke, below the hills. */
:root {
  --paper: #efeadf;
  --ink: #201c18;
  --ink-soft: #6f675d;
  --line: rgba(42, 39, 35, .22);
  --indigo: #2f536f;
  --cinnabar: #b64232;
  --f-brush: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  --f-body: "Noto Serif SC", "Songti SC", "STSong", serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper) url(assets/paper.webp) center / cover fixed;
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7;
  -webkit-tap-highlight-color: transparent;
}
.stage {
  position: relative; height: 100%; min-height: 560px; max-width: 460px; margin: 0 auto; box-sizing: border-box;
  padding: 0 24px; padding-block: clamp(14px, 3.5svh, 36px) clamp(10px, 2.6svh, 28px);
  display: flex; flex-direction: column; gap: clamp(4px, 1.3svh, 14px); overflow: hidden;
}
.veil {
  position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s ease;
  background: radial-gradient(circle at 70% 22%, rgba(32,28,24,0) 18%, rgba(32,28,24,.22) 100%);
}

header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; z-index: 3; transition: opacity .8s; }
.title { display: grid; gap: 2px; }
h1 { margin: 0; font-family: var(--f-brush); font-weight: 400; font-size: clamp(24px, 3.6svh, 30px); line-height: 1.2; }
.date { font-size: 12px; letter-spacing: .32em; color: var(--ink-soft); }

/* sky: back ridge, moon, front ridge */
.sky { position: relative; flex: 1 1 0; min-height: 130px; max-height: 300px; margin: clamp(-40px, -3svh, -8px) -24px 0; pointer-events: none; container-type: size; }
.sky:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; }
.sky img { position: absolute; pointer-events: none; max-width: none; }
.ridge-back { left: calc(50% - 36.3cqh); top: 1.3cqh; width: 113cqh; opacity: .15; transform: scaleX(-1); transition: opacity 1s, filter 1s; }
.ridge-front { left: calc(50% - 93cqh); top: -7.3cqh; width: 143cqh; opacity: .42; transition: opacity 1s, filter 1s; }
.moon-wrap { position: absolute; left: calc(50% + 26.3cqh); top: 1.3cqh; width: 37cqh; height: 37cqh; transform: translateY(var(--rise, 0px)); }
.moon-wrap img { position: static; width: 100%; opacity: .8; }
.halo { position: absolute; inset: -30%; border-radius: 50%; background: radial-gradient(circle, rgba(255,250,236,.95) 0%, rgba(255,250,236,0) 65%); opacity: 0; transition: opacity .6s; }
.pulse { position: absolute; inset: 10%; border-radius: 50%; border: 1px solid var(--ink-soft); pointer-events: none; animation: pulse 2s ease-out both; }
@keyframes pulse { from { opacity: .5; transform: scale(.8); } to { opacity: 0; transform: scale(2.6); } }
.count { position: absolute; left: 0; right: 0; top: 32cqh; text-align: center; font-family: var(--f-brush); font-size: 32cqh; line-height: 1; opacity: 0; pointer-events: none; }
.count.beat { animation: beat 1s ease-in-out both; }
@keyframes beat { 0% { opacity: 0; transform: scale(.85); filter: blur(6px); } 40% { opacity: .42; transform: scale(1); filter: blur(0); } 100% { opacity: 0; transform: scale(1.12); filter: blur(4px); } }

/* the answer */
.answer-row { position: relative; flex: none; display: flex; align-items: flex-end; gap: 12px; min-height: clamp(80px, 14svh, 130px); z-index: 2; }
.bloom { position: absolute; left: -10px; top: -40px; width: 260px; opacity: 0; pointer-events: none; }
.bloom.go { animation: bloom 2.4s cubic-bezier(.15,.7,.25,1) both; }
@keyframes bloom { 0% { opacity: 0; transform: scale(.3) rotate(-18deg); filter: blur(14px); } 35% { opacity: .14; } 100% { opacity: .07; transform: scale(1) rotate(0); filter: blur(0); } }
.answer { position: relative; display: grid; gap: 2px; filter: url(#rough); mix-blend-mode: multiply; transition: opacity .7s, filter .7s; }
.answer.wash { opacity: 0; filter: blur(8px); }
.line { display: flex; gap: 0; }
.ch { width: var(--s); height: var(--s); flex: none; }
.ch.font { font-family: var(--f-brush); font-size: calc(var(--s) * .92); line-height: 1; text-align: center; animation: fadeInk 1s both; animation-delay: calc(var(--i) * 160ms); }
@keyframes fadeInk { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: blur(0); } }

.seal { width: 42px; height: 42px; flex: none; position: relative; display: grid; place-items: center; margin-bottom: 8px; opacity: 0; transform: rotate(-4deg); }
.seal img { position: absolute; inset: 0; width: 100%; height: 100%; }
.seal span { position: relative; font-size: 12px; font-weight: 500; line-height: 1.05; color: #fbf3e6; text-align: center; max-width: 34px; }
.seal.stamp { animation: stamp .5s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes stamp { 0% { transform: scale(1.9) rotate(-16deg); opacity: 0; } 60% { transform: scale(.92) rotate(-3deg); opacity: 1; } 100% { transform: scale(1) rotate(-4deg); opacity: 1; } }
.note { margin: 0; flex: none; font-size: clamp(12.5px, 1.8svh, 14px); line-height: 1.8; color: var(--ink-soft); font-weight: 300; min-height: 1.9em; overflow-wrap: anywhere; transition: opacity .8s; }
.note.hide { opacity: 0; }
.hint { margin: 0; font-size: 13px; letter-spacing: .2em; color: var(--ink-soft); min-height: 1.7em; }

.guide { margin: 0; padding: 0; list-style: none; display: grid; gap: clamp(0px, .5svh, 4px); flex: none; font-size: clamp(11.5px, 1.75svh, 13px); line-height: 1.6; color: var(--ink-soft); transition: opacity .8s; }
.guide li { display: flex; gap: 10px; align-items: baseline; }
.guide b { font-family: var(--f-brush); font-weight: 400; font-size: 17px; color: var(--ink); width: 1.2em; flex: none; }
.guide.hide { opacity: 0; }
.press { flex: none; display: grid; justify-items: center; gap: clamp(2px, .7svh, 6px); position: relative; }
.ring {
  width: clamp(88px, 14svh, 124px); height: clamp(88px, 14svh, 124px); position: relative; display: grid; place-items: center; border-radius: 50%; cursor: pointer;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.ring:focus-visible { outline: 2px solid var(--indigo); outline-offset: 4px; }
.ring > * { grid-area: 1 / 1; pointer-events: none; }
.ring .enso { width: 100%; height: 100%; opacity: .85; animation: breathe 5s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.04); opacity: .6; } }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--cinnabar); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 402; stroke-dashoffset: calc(402 * (1 - var(--k, 0))); }
.ring .tip { font-size: 13px; letter-spacing: .16em; color: var(--ink); background: rgba(250,245,236,.75); padding: 1px 6px; border-radius: 2px; }
.ring .call { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--cinnabar); opacity: 0; }
.ring.invite .call { animation: call 2s ease-out infinite; }
.ring.invite .call + .call { animation-delay: 1s; }
@keyframes call { 0% { opacity: .7; transform: scale(.82); } 100% { opacity: 0; transform: scale(1.45); } }
.ring.invite .tip { animation: tipBlink 2s ease-in-out infinite; }
@keyframes tipBlink { 50% { color: var(--cinnabar); } }
.idle { font-family: var(--f-brush); font-size: clamp(26px, 4.2svh, 34px); line-height: 1.4; color: var(--ink-soft); animation: idleBreath 4.5s ease-in-out infinite; }
@keyframes idleBreath { 0%, 100% { opacity: .35; } 50% { opacity: .75; } }
.ring.on .enso { animation: none; opacity: 1; transform: scale(.94); transition: transform .4s; }
.press .cap { font-size: 12px; letter-spacing: .24em; color: var(--ink-soft); min-height: 1.7em; }
.again { font: inherit; font-size: 12px; letter-spacing: .2em; color: var(--ink-soft); background: none; border: none; padding: 6px 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* meditation: the moon rises; everything else recedes */
.stage.meditate header, .stage.meditate .guide, .stage.meditate .note, .stage.meditate .again { opacity: .2; }
.stage.meditate .ridge-front { opacity: .22; filter: blur(1.5px); }
.stage.meditate .ridge-back { opacity: .07; filter: blur(2px); }
.stage.meditate .halo { opacity: .9; }
.stage.meditate ~ .veil { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
}
</style>

<main class="stage" id="stage">
  <header>
    <div class="title"><h1>答案之书</h1><div class="date" id="date"></div></div>
    <button class="again" id="today" type="button">今日之页</button>
  </header>

  <div class="sky" aria-hidden="true">
    <img class="ridge-back" src="assets/mountain.webp" alt="">
    <div class="moon-wrap" id="moon"><div class="halo"></div><img src="assets/moon.webp" alt=""></div>
    <img class="ridge-front" src="assets/mountain.webp" alt="">
    <div class="count" id="count" aria-hidden="true"></div>
  </div>

  <div class="answer-row">
    <img class="bloom" id="bloom" src="assets/ink-splash.webp" alt="">
    <div class="answer" id="answer" aria-hidden="true"></div>
    <div class="seal" id="seal"><img src="assets/seal-stamp.webp" alt=""><span id="sealText"></span></div>
    <p class="sr" id="answerText" aria-live="polite"></p>
  </div>
  <p class="note" id="note"></p>
  
  <ol class="guide" id="guide">
    <li><b>一</b><span>静心：深呼吸，在心里想一件你想问的事</span></li>
    <li><b>二</b><span>触月：把手指放进下面的圆圈，按住不要松开</span></li>
    <li><b>三</b><span>三息：跟着提示呼吸三次，答案会自己写出来</span></li>
  </ol>

  <div class="press">
    <div class="ring" id="ring" role="button" tabindex="0" aria-label="按住圆圈三秒，得到答案">
      <img class="enso" src="assets/circle-ring.webp" alt="">
      <svg viewBox="0 0 132 132" aria-hidden="true"><circle class="track" cx="66" cy="66" r="64"></circle></svg>
      <span class="call"></span><span class="call"></span>
      <span class="tip" id="tip">按住三秒</span>
    </div>
    <div class="cap" id="cap">心里想好了，就把手指放上来</div>
  </div>
</main>
<div class="veil" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
  </filter>
</svg>

<script>
const ANSWERS = [
  "是的。","不是现在。","再等一等。","放手去做。","答案就在你身边。","别急着下结论。","先睡一觉再说。",
  "相信你的第一感觉。","这件事值得。","不值得为它烦恼。","换个角度看看。","去问问你信任的人。","这一次，说出来。",
  "保持沉默更好。","会比你想的顺利。","需要更多耐心。","现在正是时候。","机会还会再来。","先照顾好自己。",
  "你已经知道答案了。","试一次也无妨。","别把它想得太复杂。","这不是你的责任。","去吧，别回头。","留在原地也是一种选择。",
  "答案会在路上出现。","把它写下来。","今天不宜决定。","肯定会有收获。","可能会有意外。","听从你的心。",
  "也听听你的理智。","少一点担心。","再确认一次细节。","值得冒这个险。","别冒这个险。","让别人先开口。",
  "主动一点。","轻一点，慢一点。","坚持下去。","是时候换条路了。","它会自己解决。","你需要一个计划。",
  "做个小小的尝试。","不要妥协。","退一步海阔天空。","会有好消息。","笑一笑再说。","不要过度承诺。",
  "把注意力放回当下。","这是一次成长。","有人在等你的回应。","先完成手头的事。","绝对可以。","几乎不可能。",
  "未必，但值得一试。","答案在细节里。","别管别人怎么看。","照规则来。","这次可以破个例。","给它一点时间。",
  "你比自己以为的更有准备。","先吃顿好的。","出去走走就明白了。","把门留着。","关上这扇门。","选那个让你安心的。",
  "选那个让你心动的。","是个好兆头。","不必勉强。","慷慨一点。","这次为自己着想。","明天会更清楚。",
  "旧的方法依然有效。","尝试新的方法。","不会后悔的。","你会学到东西。","不要只看表面。","别再犹豫了。",
  "把它交给时间。","一切都会好的。","再问一次，带着诚意。","说“好”。","说“不”。","不如先说“也许”。",
  "钱不是重点。","这关乎你的心情。","做减法。","多准备一个备选。","有人会帮你。","这一步只能自己走。",
  "你担心的不会发生。","留意身边的小事。","先道个歉。","不必解释太多。","现在开始，还不晚。","是该结束了。",
  "保持好奇。","温柔地坚持。","答案是肯定的。","答案是否定的。","你会感谢今天的决定。"
];

const $ = id => document.getElementById(id);
const stage = $("stage"), answerEl = $("answer"), moon = $("moon");
const HOLD_MS = 3000;
const NUM = ["一", "二", "三"];
const BREATH = ["吸 ——", "呼 ——", "心定"];
const MOON_LOW = 150;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function todayKey(d = new Date()) {
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function hash(str) {
  let h = 2166136261;
  for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function cnNum(n) {
  const d = "〇一二三四五六七八九";
  if (n < 10) return d[n];
  if (n < 20) return "十" + (n % 10 ? d[n % 10] : "");
  if (n < 100) return d[Math.floor(n / 10)] + "十" + (n % 10 ? d[n % 10] : "");
  const r = n % 100;
  return d[Math.floor(n / 100)] + "百" + (r === 0 ? "" : r < 10 ? "零" + d[r] : (r < 20 ? "一" : "") + cnNum(r));
}
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch {} }
function animate(ms, fn, done) {
  const t0 = performance.now();
  let id;
  const step = now => {
    const k = Math.min(1, (now - t0) / ms);
    fn(k);
    if (k < 1) id = requestAnimationFrame(step); else done && done();
  };
  id = requestAnimationFrame(step);
  return () => cancelAnimationFrame(id);
}
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
function setMoon(px) { moon.style.setProperty("--rise", px + "px"); }

/* stroke data for every character in ANSWERS, bundled locally */
let strokes = null;
const strokesReady = fetch("assets/strokes.json").then(r => r.json()).then(d => { strokes = d; }).catch(() => {});

/* brush the answer, one stroke at a time */
let writeToken = 0;
function layout(n) {
  const perLine = n <= 5 ? n : n <= 10 ? Math.ceil(n / 2) : Math.ceil(n / 3);
  const size = n <= 4 ? 64 : n <= 10 ? 54 : 44;
  const byHeight = Math.floor(innerHeight * (n <= 5 ? .085 : .07));
  return { perLine, size: Math.min(size, byHeight, Math.floor((Math.min(innerWidth, 460) - 110) / perLine)) };
}
function brush(text, onDone) {
  const token = ++writeToken;
  const chars = [...text];
  const { perLine, size } = layout(chars.length);
  answerEl.style.setProperty("--s", size + "px");
  const lines = [];
  const boxes = chars.map((ch, i) => {
    if (i % perLine === 0) { const l = document.createElement("div"); l.className = "line"; lines.push(l); }
    const b = document.createElement("div");
    b.className = "ch"; b.style.setProperty("--i", i);
    lines[lines.length - 1].append(b);
    return b;
  });
  answerEl.replaceChildren(...lines);
  answerEl.classList.remove("wash");

  const canStroke = window.HanziWriter && strokes;
  if (!canStroke) {
    boxes.forEach((b, i) => { b.classList.add("font"); b.textContent = chars[i]; });
    setTimeout(onDone, chars.length * 160 + 900);
    return;
  }
  const writers = boxes.map((b, i) => HanziWriter.create(b, chars[i], {
    width: size, height: size, padding: 2,
    showOutline: false, showCharacter: false,
    strokeColor: "#201c18", drawingColor: "#201c18",
    strokeAnimationSpeed: 1.9, delayBetweenStrokes: 70,
    charDataLoader: (c, ok, fail) => strokes[c] ? ok(strokes[c]) : fail(new Error("no data")),
    onLoadCharDataError: () => { b.classList.add("font"); b.textContent = chars[i]; },
  }));
  if (reduced) { writers.forEach(w => w.showCharacter()); onDone(); return; }
  let i = 0;
  const next = () => {
    if (token !== writeToken) return;
    if (i >= writers.length) { onDone(); return; }
    const w = writers[i++];
    if (!strokes[chars[i - 1]]) { setTimeout(next, 200); return; }
    w.animateCharacter({ onComplete: () => setTimeout(next, 120) });
  };
  next();
}

function reveal(index, kind, question) {
  const text = ANSWERS[index].replace(/[。！？]$/, "").replace(/[，、“”]/g, "");
  $("answerText").textContent = ANSWERS[index];
  $("seal").classList.remove("stamp");
  $("seal").style.opacity = 0;
  $("sealText").textContent = cnNum(index + 1);
  $("note").classList.add("hide");
  restart($("bloom"), "go");
  strokesReady.then(() => brush(text, () => {
    restart($("seal"), "stamp"); $("seal").style.opacity = "";
    vibrate(18);
    $("note").textContent = kind === "今日之页" ? `今日之页 · 第${cnNum(index + 1)}页　山不动，月自来。` : `你心中所想之事 · 第${cnNum(index + 1)}页`;
    $("note").classList.remove("hide");
  }));
  $("cap").textContent = kind === "今日之页" ? "心里想好了，就把手指放上来" : "墨已落纸。想再问，就再静一次心";
}

function showIdle() {
  writeToken++;
  const t = document.createElement("div");
  t.className = "idle"; t.append("先在心里，", document.createElement("br"), "默想一件事");
  answerEl.replaceChildren(t);
  answerEl.classList.remove("wash");
  $("seal").style.opacity = 0;
  $("note").textContent = "";
  $("answerText").textContent = "";
  $("cap").textContent = "心里想好了，就把手指放上来";
  $("ring").classList.add("invite");
}

function showToday() {
  answerEl.classList.add("wash");
  setTimeout(() => reveal(hash("daily:" + todayKey()) % ANSWERS.length, "今日之页", ""), reduced ? 0 : 500);
}

/* hold to meditate: three breaths while the moon rises */
let holding = false, done = false, stopAnim = null, beats = [];
function startHold(e) {
  if (holding) return;
  e && e.preventDefault();
  holding = true; done = false; writeToken++;
  stage.classList.add("meditate");
  answerEl.classList.add("wash");
  $("seal").style.opacity = 0;
  $("cap").textContent = BREATH[0];
  $("tip").textContent = "";
  $("ring").classList.add("on");
  $("ring").classList.remove("invite");
  $("guide").classList.add("hide");
  setMoon(MOON_LOW);
  stopAnim = animate(HOLD_MS, k => {
    setMoon(MOON_LOW * (1 - easeInOut(k)));
    $("ring").style.setProperty("--k", k);
  }, complete);
  NUM.forEach((n, i) => beats.push(setTimeout(() => {
    $("count").textContent = n; restart($("count"), "beat");
    $("cap").textContent = BREATH[i];
    const r = document.createElement("div"); r.className = "pulse";
    moon.append(r); setTimeout(() => r.remove(), 2100);
    vibrate(8);
  }, i * 1000)));
}
function clearHold() {
  holding = false;
  beats.forEach(clearTimeout); beats = [];
  stage.classList.remove("meditate");
  $("ring").style.setProperty("--k", 0);
  $("ring").classList.remove("on");
  $("tip").textContent = "按住三秒";
}
function endHold() {
  if (!holding) return;
  stopAnim && stopAnim();
  clearHold();
  if (done) return;
  const from = parseFloat(moon.style.getPropertyValue("--rise")) || 0;
  animate(500, k => setMoon(from * (1 - easeOut(k))));
  answerEl.classList.remove("wash");
  $("seal").style.opacity = "";
  $("cap").textContent = "心未静，再来一次";
  $("ring").classList.add("invite");
  $("guide").classList.remove("hide");
}
function complete() {
  done = true;
  clearHold();
  setMoon(0);
  reveal(Math.floor(Math.random() * ANSWERS.length), "你的这一页", "");
}

for (const el of [$("ring")]) {
  el.addEventListener("pointerdown", startHold);
  el.addEventListener("pointerup", endHold);
  el.addEventListener("pointerleave", endHold);
  el.addEventListener("pointercancel", endHold);
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) startHold(e); });
  el.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") endHold(); });
}
$("today").addEventListener("click", () => { $("guide").classList.remove("hide"); showToday(); });

const now = new Date();
$("date").textContent = `${cnNum(now.getMonth() + 1)}月${cnNum(now.getDate())}日 · 月上东山`;
showIdle();
</script>

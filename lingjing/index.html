<style>
/* Layout: the real camera fills the screen untouched; a transparent 3D layer on top holds the
   hologram world, held still in space by the phone's motion sensors. A thin HUD frames it:
   compass ribbon at the top, crosshair in the middle, a tray of things to summon at the bottom. */
:root {
  --cyan: #7ff3ff;
  --gold: #ffd27a;
  --zhu: #ff5a3c;
  --glass: rgba(8, 22, 30, .42);
  --line: rgba(127, 243, 255, .35);
  --text: #e8fbff;
  --f-brush: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  --f-ui: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: #02080b; color: var(--text); font-family: var(--f-ui);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; }
[hidden] { display: none !important; }
#cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #02080b; }
#cam.mirror { transform: scaleX(-1); }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.scan { position: fixed; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(127,243,255,.035) 0 1px, transparent 1px 4px);
  box-shadow: inset 0 0 120px rgba(0, 40, 60, .55); }

/* HUD */
.hud { position: fixed; inset: 0; pointer-events: none; }
.compass { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  width: min(78vw, 420px); height: 34px; overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
.compass .tape { position: absolute; top: 0; left: 50%; height: 100%; white-space: nowrap; }
.compass span { position: absolute; top: 4px; transform: translateX(-50%); font: 400 18px/1 var(--f-brush); color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
.compass span.tick { top: 22px; width: 1px; height: 8px; background: var(--line); }
.compass span.major { color: var(--gold); text-shadow: 0 0 10px var(--gold); font-size: 22px; top: 1px; }
.compass::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 0; height: 0; transform: translateX(-50%);
  border: 5px solid transparent; border-bottom-color: var(--gold); }
.title { position: absolute; top: calc(48px + env(safe-area-inset-top, 0px)); left: 16px; font: 400 22px/1 var(--f-brush); letter-spacing: .15em;
  color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
.title small { display: block; margin-top: 6px; font: 500 10px/1 var(--f-ui); letter-spacing: .25em; color: rgba(232,251,255,.6); text-shadow: none; }
.reticle { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; transform: translate(-50%, -50%); }
.reticle svg { width: 100%; height: 100%; overflow: visible; }
.reticle circle, .reticle path { fill: none; stroke: var(--cyan); stroke-width: 1.4; filter: drop-shadow(0 0 4px var(--cyan)); }
.reticle .spin { transform-origin: 32px 32px; animation: spin 8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.corner { position: absolute; width: 26px; height: 26px; border: 2px solid var(--line); }
.corner.tl { top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; border-right: 0; border-bottom: 0; }
.corner.tr { top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; border-left: 0; border-bottom: 0; }
.corner.bl { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 12px; border-right: 0; border-top: 0; }
.corner.br { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); right: 12px; border-left: 0; border-top: 0; }
.pointer { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 8px; border-radius: 999px;

<script type="module">

/* ---------- the floor array: a taiji with the eight trigrams, turning slowly underfoot ---------- */
const FLOOR = -1.45;

scene.add(array);
const grid = new THREE.PolarGridHelper(9, 16, 9, 64, 0x7ff3ff, 0x7ff3ff);

const spines = new THREE.InstancedMesh(new THREE.ConeGeometry(.5, 1.6, 4), new THREE.MeshBasicMaterial({ color: 0xffc85a, transparent: true, opacity: .9 }), SEG);

  const skull = new THREE.Mesh(new THREE.SphereGeometry(.34, 18, 12), new THREE.MeshBasicMaterial({ color: 0x2cc6e2, transparent: true, opacity: .75 })); skull.scale.set(1, .8, 1.5); head.add(skull);
  const wire = new THREE.Mesh(new THREE.SphereGeometry(.35, 12, 8), new THREE.MeshBasicMaterial({ color: 0xcffbff, wireframe: true, transparent: true, opacity: .4, blending: THREE.AdditiveBlending })); wire.scale.copy(skull.scale); head.add(wire);
  const snout = new THREE.Mesh(new THREE.ConeGeometry(.22, .6, 10), new THREE.MeshBasicMaterial({ color: 0x2cc6e2, transparent: true, opacity: .75 })); snout.rotation.x = Math.PI / 2; snout.position.z = .62; head.add(snout);

let dragonAngle = 0, dragonSpeed = .16, summon = false;

for (let i = 0; i < 16; i++) {

const PANELS = [
  [.6, ['灵境 · 天机', '青龙巡天中', '灵气　八十七', '今日宜：画圆']],

  talisman: () => {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.PlaneGeometry(.3, .75), new THREE.MeshBasicMaterial({ map: talismanTex, transparent: true, opacity: .95, side: THREE.DoubleSide })));
    g.add(glow(0xffd27a, 1.2, .45)); return g;
  },
  lotus: () => {
    const g = new THREE.Group(), petal = new THREE.SphereGeometry(.16, 12, 8);
    for (const [n, r, tilt, col] of [[8, .16, 1.0, 0x7ff3ff], [6, .09, .6, 0xb8f8ff]]) for (let i = 0; i < n; i++) {
      const p = new THREE.Mesh(petal, holo(col, .5)); p.scale.set(.45, .2, 1);
      const a = i / n * Math.PI * 2; p.position.set(Math.sin(a) * r, .05, Math.cos(a) * r); p.rotation.set(-tilt, a, 0, 'YXZ'); g.add(p);
    }
    const core = glow(0xffd27a, .5, 1); core.position.y = .12;
    g.add(core, glow(0x7ff3ff, 1.4, .5)); return g;
  },
};
let kind = 'lantern';
const placed = [];
const camDir = new THREE.Vector3();
function place() {
  const obj = MAKE[kind]();
  obj.position.copy(camera.position).addScaledVector(camDir, 2.6);
  obj.userData = { born: clock.elapsedTime, y: obj.position.y, ph: Math.random() * 6 };
  if (kind === 'talisman') obj.lookAt(camera.position);
  const ring = new THREE.Mesh(new THREE.RingGeometry(.2, .24, 48), holo(0x7ff3ff, .9)); ring.lookAt(camera.position.clone().sub(obj.position));
  obj.add(ring); obj.userData.ring = ring;
  scene.add(obj); placed.push(obj);
  if (placed.length > 20) scene.remove(placed.shift());
}

/* ---------- HUD ---------- */
const DIRS = ['北', '东北', '东', '东南', '南', '西南', '西', '西北'];
const tape = $('tape'), PX = 3.2;   // pixels per degree on the compass ribbon
for (let d = -360; d <= 720; d += 15) {
  const el = document.createElement('span'), n = ((d % 360) + 360) % 360;
  if (n % 45 === 0) { el.textContent = DIRS[n / 45]; if (n % 90 === 0) el.className = 'major'; } else el.className = 'tick';
  el.style.left = d * PX + 'px'; tape.appendChild(el);
}
const pointer = $('pointer'), hint = $('hint');
function updateHud(now) {
  // compass: true north on iPhone, otherwise north is wherever you faced when you started
  let deg = THREE.MathUtils.radToDeg(Math.atan2(camDir.x, -camDir.z));
  if (heading != null) deg = heading;
  deg = ((deg % 360) + 360) % 360;
  tape.style.transform = `translateX(${-deg * PX}px)`;
  // point to the dragon's head when it's out of view
  tmp.copy(head.position).project(camera);
  const behind = head.position.clone().sub(camera.position).dot(camDir) < 0;
  const inView = !behind && Math.abs(tmp.x) < .85 && Math.abs(tmp.y) < .85;
  pointer.style.opacity = inView || !started ? 0 : 1;
  if (!inView) {
    let x = tmp.x, y = tmp.y; if (behind) { x = -x; y = -y; }
    const a = Math.atan2(y, x), m = Math.max(Math.abs(Math.cos(a)), Math.abs(Math.sin(a)) * innerWidth / innerHeight);
    const px = innerWidth / 2 + Math.cos(a) / m * (innerWidth / 2 - 90), py = innerHeight / 2 - Math.sin(a) * innerHeight / 2 / (m * innerHeight / innerWidth || 1) * .8;
    pointer.style.transform = `translate(${Math.min(innerWidth - 120, Math.max(16, px - 50))}px, ${Math.min(innerHeight - 140, Math.max(90, py - 16))}px)`;
    pointer.querySelector('i').style.transform = `rotate(${-a}rad)`;
  }
  if (started && now - started > 7000) hint.style.opacity = 0;
}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const look = new THREE.Quaternion(), eulerDrag = new THREE.Euler(0, 0, 0, 'YXZ');
let started = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (useSensor && sensor) look.copy(sensorQuat(sensor)); else look.setFromEuler(eulerDrag.set(pitch, yaw, 0));
  camera.quaternion.slerp(look, .35);
  camera.getWorldDirection(camDir);
  array.rotation.z = t * .05; grid.rotation.y = -t * .02;
  updateDragon(t, dt);
  lanterns.forEach(l => { l.position.y = l.userData.y + Math.sin(t * .6 + l.userData.ph) * .18; l.rotation.y = t * .3 + l.userData.ph; });
  panels.forEach(p => { p.position.y = p.userData.y + Math.sin(t * .8 + p.userData.ph) * .05; });
  placed.forEach(o => {
    const age = t - o.userData.born, k = Math.min(1, age / .35);
    o.scale.setScalar(k * (1 + .06 * Math.sin(age * 2)));
    o.position.y = o.userData.y + Math.sin(t * .9 + o.userData.ph) * .06;
    const r = o.userData.ring; if (r) { r.scale.setScalar(1 + age * 4); r.material.opacity = Math.max(0, .9 - age * 1.2); if (age > 1) { o.remove(r); o.userData.ring = null; } }
    if (o.children.length && o.children[0].geometry?.type === 'PlaneGeometry') o.lookAt(camera.position);
  });
  updateHud(performance.now());
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
paintText();
document.fonts?.load('40px "Ma Shan Zheng"').then(paintText).catch(() => {});
requestAnimationFrame(frame);

/* ---------- start ---------- */
$('go').addEventListener('click', async () => {
  // iPhone asks for motion access, and only from a tap
  try { if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch {}
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = stream; await video.play();
    const f = stream.getVideoTracks()[0].getSettings().facingMode;
    video.classList.toggle('mirror', f ? f === 'user' : !matchMedia('(pointer: coarse)').matches);
  } catch { hint.textContent = '摄像头没能打开，先看看全息世界吧'; }
  $('gate').hidden = true; $('hud').hidden = false; $('tray').hidden = false;
  started = performance.now();
  setTimeout(() => { if (!useSensor) hint.textContent = '拖动画面环顾四周，点一下放东西'; }, 1200);
});
document.querySelectorAll('[data-item]').forEach(b => b.addEventListener('click', () => {
  kind = b.dataset.item; document.querySelectorAll('[data-item]').forEach(x => x.classList.toggle('on', x === b));
}));
$('call').addEventListener('click', () => { summon = true; });
$('clear').addEventListener('click', () => { placed.forEach(o => scene.remove(o)); placed.length = 0; });
</script>
</body>
